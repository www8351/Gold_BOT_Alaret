# Prometheus scrapes the statsd_exporter (which ingests the bot's UDP StatsD
# metrics) and itself.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: statsd_exporter
    static_configs:
      - targets: ["statsd-exporter:9102"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
