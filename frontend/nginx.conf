server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve the built app, fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy data + chart + health to the bot's aiohttp server (same Docker network)
    location /api/      { proxy_pass http://bot:8080; }
    location /chart.png { proxy_pass http://bot:8080; }
    location /health    { proxy_pass http://bot:8080; }
}
